<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aptus — Robô de Avaliação da Eficácia dos Treinamentos — SSMA Onça Puma</title>
<style>
  :root{
    --teal:#3CB5E5; --teal-dark:#0E6E96; --teal-deep:#0B4C66;
    --vale-green:#00A65A; --vale-green-bg:#E6F7EE; --vale-yellow:#FFCC00; --vale-yellow-bg:#FFF8DE;
    --navy:#0B1220; --navy-soft:#16213A; --mid:#475569; --soft:#64748B;
    --card:#F8FAFC; --line:#E2E8F0; --green:#16A34A; --green-bg:#ECFDF5; --red:#DC2626; --red-bg:#FEF2F2;
    --amber:#B45309; --amber-bg:#FFFBEB;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:Calibri,'Segoe UI',system-ui,Arial,sans-serif;background:#EEF3F7;color:var(--navy);-webkit-font-smoothing:antialiased;}
  header{background:#fff;position:relative;position:sticky;top:0;z-index:10;box-shadow:0 1px 3px rgba(15,23,42,.06);border-bottom:3px solid transparent;border-image:linear-gradient(90deg,var(--teal) 0%,var(--teal) 45%,var(--vale-green) 75%,var(--vale-yellow) 100%) 1;}
  .wrap{max-width:820px;margin:0 auto;padding:0 18px;position:relative;}
  header .wrap{display:flex;align-items:center;justify-content:space-between;padding-top:14px;padding-bottom:14px;}
  .brand{display:flex;align-items:center;gap:11px;}
  .brand .titles{line-height:1.3;}
  .brand .eyebrow{font-size:11px;font-weight:bold;letter-spacing:1.6px;color:var(--teal-dark);text-transform:uppercase;}
  .brand .t1{font-weight:bold;color:var(--navy);font-size:17px;letter-spacing:.2px;}
  .brand .t2{font-size:10.5px;color:var(--soft);}
  .modeToggle{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;font-size:12px;font-weight:bold;background:#F8FAFC;}
  .modeToggle button{border:none;background:transparent;color:var(--mid);padding:7px 14px;cursor:pointer;transition:background .15s,color .15s;}
  .modeToggle button.active{background:var(--teal);color:#fff;}
  main{max-width:820px;margin:0 auto;padding:22px 16px 60px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 1px 2px rgba(15,23,42,.04),0 1px 8px rgba(15,23,42,.05);}
  .card.soft{background:var(--card);}
  h2{font-size:21px;margin:0 0 4px;letter-spacing:-.2px;}
  .muted{color:var(--soft);font-size:13px;}
  label{font-size:12px;font-weight:bold;color:var(--mid);display:block;margin-bottom:4px;}
  input[type=text],input[type=number],textarea,select{
    width:100%;border:1.5px solid #dce3ea;border-radius:9px;padding:9px 11px;font-size:14px;font-family:inherit;margin-bottom:12px;transition:border-color .15s,box-shadow .15s;
  }
  input[type=text]:focus,input[type=number]:focus,textarea:focus,select:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(60,181,229,.15);}
  textarea{font-family:monospace;font-size:12.5px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:9px;padding:10px 16px;font-weight:bold;font-size:14px;cursor:pointer;transition:filter .15s,transform .05s;}
  .btn:active{transform:translateY(1px);}
  .btn-teal{background:linear-gradient(145deg,var(--teal),var(--teal-dark));color:#fff;box-shadow:0 2px 6px rgba(60,181,229,.3);}
  .btn-teal:hover{filter:brightness(1.05);}
  .btn-green{background:var(--green);color:#fff;}
  .btn-dark{background:var(--navy);color:#fff;}
  .btn-outline{background:#fff;border:1.5px solid #dce3ea;color:var(--mid);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn-block{width:100%;}
  .qopt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:10px 12px;margin-bottom:8px;cursor:pointer;font-size:14px;transition:border-color .15s,background .15s;}
  .qopt:hover{background:#f5f9fb;border-color:#c9dae4;}
  .qopt.correct{background:var(--green-bg);border-color:var(--green);color:var(--green);font-weight:bold;}
  .qopt.selected{background:#EBF8FE;border-color:var(--teal);}
  .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:bold;}
  .badge-green{background:var(--green-bg);color:var(--green);}
  .badge-red{background:var(--red-bg);color:var(--red);}
  .badge-amber{background:var(--amber-bg);color:var(--amber);}
  .badge-teal{background:#EBF8FE;color:var(--teal-dark);}
  .badge-vale-yellow{background:var(--vale-yellow-bg);color:#8A6D00;}
  .badge-vale-green{background:var(--vale-green-bg);color:var(--vale-green);}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{background:var(--navy);color:#fff;text-align:left;padding:8px 6px;}
  td{padding:6px;border-bottom:1px solid #f1f5f9;}
  .pill-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .pill{padding:5px 12px;border-radius:999px;font-size:11px;font-weight:bold;}
  .qcard{border:1.5px solid var(--line);border-radius:11px;padding:12px;margin-bottom:10px;}
  .qcard.pending{border-color:#fcd34d;}
  .qopt-mini{display:flex;align-items:center;gap:6px;font-size:12.5px;padding:6px 8px;border-radius:6px;background:#f8fafc;margin-bottom:4px;cursor:pointer;}
  .qopt-mini.correct{background:var(--green-bg);color:var(--green);font-weight:bold;}
  .dot{width:16px;height:16px;border-radius:50%;border:1px solid #cbd5e1;display:inline-flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0;}
  .dot.correct{border-color:var(--green);color:var(--green);}
  .tabbar{display:flex;gap:4px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:4px;margin-bottom:16px;box-shadow:0 1px 2px rgba(15,23,42,.04);}
  .tabbar button{flex:1;border:none;background:transparent;padding:8px;border-radius:8px;font-size:12px;font-weight:bold;color:var(--mid);cursor:pointer;transition:background .15s,color .15s;}
  .tabbar button.active{background:var(--teal);color:#fff;}
  .hidden{display:none !important;}
  .footNote{font-size:11px;color:var(--soft);margin-top:8px;}
  @media print{
    header,.no-print{display:none !important;}
    body{background:#fff;}
    .print-only{display:block !important;}
  }
  .print-only{display:none;}
  .printHead{border-bottom:2px solid var(--teal);padding-bottom:10px;margin-bottom:16px;}
  .printGrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 20px;font-size:12px;border:1px solid #999;padding:10px;margin-bottom:14px;}
  .qPrint{margin-bottom:14px;}
  .optPrint{display:flex;gap:8px;align-items:flex-start;font-size:13px;margin:2px 0 2px 12px;}
  .circle{width:14px;height:14px;border:1px solid #666;border-radius:50%;flex-shrink:0;margin-top:2px;}
  table.presTable{border:1px solid #333;}
  table.presTable th,table.presTable td{border:1px solid #999;padding:6px;}
</style>
</head>

<header class="no-print">
  <div class="wrap">
    <div class="brand">
      <div class="titles">
        <div class="eyebrow">SSMA &middot; On&ccedil;a Puma</div>

        <div class="t2">Teste digital</div>

</header>

<main id="app"></main>

var qrcode = function() {

  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = new Array();

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw new Error('code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')');
      }

      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw new Error(row + ',' + col);
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      makeImpl(false, getBestMaskPattern() );
    };

    _this.createSvgTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;
      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg';
      qrSvg += ' width="' + size + 'px"';
      qrSvg += ' height="' + size + 'px"';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '"';
      qrSvg += ' xmlns="http://www.w3.org/2000/svg"';
      qrSvg += '>';
      qrSvg += '<rect width="100%" height="100%" fill="white"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    return _this;
  };

  qrcode.stringToBytes = function(s) {
    var bytes = new Array();
    for (var i = 0; i < s.length; i += 1) {
      var c = s.charCodeAt(i);
      bytes.push(c & 0xff);
    }
    return bytes;
  };

  var QRMode = {
    MODE_NUMBER :    1 << 0,
    MODE_ALPHA_NUM : 1 << 1,
    MODE_8BIT_BYTE : 1 << 2,
    MODE_KANJI :     1 << 3
  };

  var QRErrorCorrectionLevel = {
    L : 1,
    M : 0,
    Q : 3,
    H : 2
  };

  var QRMaskPattern = {
    PATTERN000 : 0,
    PATTERN001 : 1,
    PATTERN010 : 2,
    PATTERN011 : 3,
    PATTERN100 : 4,
    PATTERN101 : 5,
    PATTERN110 : 6,
    PATTERN111 : 7
  };

  var QRUtil = function() {

    var PATTERN_POSITION_TABLE = [
      [],
      [6, 18],
      [6, 22],
      [6, 26],
      [6, 30],
      [6, 34],
      [6, 22, 38],
      [6, 24, 42],
      [6, 26, 46],
      [6, 28, 50],
      [6, 30, 54],
      [6, 32, 58],
      [6, 34, 62],
      [6, 26, 46, 66],
      [6, 26, 48, 70],
      [6, 26, 50, 74],
      [6, 30, 54, 78],
      [6, 30, 56, 82],
      [6, 30, 58, 86],
      [6, 34, 62, 90],
      [6, 28, 50, 72, 94],
      [6, 26, 50, 74, 98],
      [6, 30, 54, 78, 102],
      [6, 28, 54, 80, 106],
      [6, 32, 58, 84, 110],
      [6, 30, 58, 86, 114],
      [6, 34, 62, 90, 118],
      [6, 26, 50, 74, 98, 122],
      [6, 30, 54, 78, 102, 126],
      [6, 26, 52, 78, 104, 130],
      [6, 30, 56, 82, 108, 134],
      [6, 34, 60, 86, 112, 138],
      [6, 30, 58, 86, 114, 142],
      [6, 34, 62, 90, 118, 146],
      [6, 30, 54, 78, 102, 126, 150],
      [6, 24, 50, 76, 102, 128, 154],
      [6, 28, 54, 80, 106, 132, 158],
      [6, 32, 58, 84, 110, 136, 162],
      [6, 26, 54, 82, 110, 138, 166],
      [6, 30, 58, 86, 114, 142, 170]
    ];
    var G15 = (1 << 10) | (1 << 8) | (1 << 5) | (1 << 4) | (1 << 2) | (1 << 1) | (1 << 0);
    var G18 = (1 << 12) | (1 << 11) | (1 << 10) | (1 << 9) | (1 << 8) | (1 << 5) | (1 << 2) | (1 << 0);
    var G15_MASK = (1 << 14) | (1 << 12) | (1 << 10) | (1 << 4) | (1 << 1);

    var _this = {};

    var getBCHDigit = function(data) {
      var digit = 0;
      while (data != 0) {
        digit += 1;
        data >>>= 1;
      }
      return digit;
    };

async function syncFirestoreSubmissions(sessionId) {
  if (!FIREBASE_ENABLED || !db || !sessionId) return;
  try {
    const snap = await db.collection("aptus_submissions").where("sessionId", "==", sessionId).get();
    if (!STORE.submissions[sessionId]) STORE.submissions[sessionId] = [];
    const existing = STORE.submissions[sessionId];
    const existingIds = new Set(existing.map((r) => r.id));
    let added = 0;
    snap.forEach((doc) => {
      const d = doc.data();
      if (!existingIds.has(d.id)) {
        existing.push(d);
        existingIds.add(d.id);
        added += 1;
      }
    });
    if (added) {
      existing.sort((a, b) => a.timestamp - b.timestamp);
      saveStore(STORE);
    }
    render();
  } catch (e) {
    console.error("Erro ao sincronizar com o Firestore:", e);
  }
}

const STORE_KEY = "robo_provas_v1";
function loadStore(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return { sessions: [], activeSessionId: null, submissions: {}, customTemplates: [] };
    const parsed = JSON.parse(raw);
    if(!parsed.customTemplates) parsed.customTemplates = [];
    return parsed;
  }catch(e){ return { sessions: [], activeSessionId: null, submissions: {}, customTemplates: [] }; }
}
function mergeStore(incoming){
  const merged = { sessions: STORE.sessions.slice(), activeSessionId: STORE.activeSessionId, submissions: {...STORE.submissions}, customTemplates: STORE.customTemplates.slice() };

  // sessions: union by id (keep existing on conflict — a session's own content doesn't change after creation)
  const existingSessionIds = new Set(merged.sessions.map(s=>s.id));
  let addedSessions = 0;
  (incoming.sessions||[]).forEach(s=>{
    if(!existingSessionIds.has(s.id)){ merged.sessions.push(s); existingSessionIds.add(s.id); addedSessions++; }
  });
  merged.sessions.sort((a,b)=>b.createdAt-a.createdAt);

  // submissions: merge per session, dedup by id (or by nome+matricula+timestamp for older records without id)
  let addedSubs = 0;
  Object.keys(incoming.submissions||{}).forEach(sid=>{
    if(!merged.submissions[sid]) merged.submissions[sid] = [];
    const existing = merged.submissions[sid];
    const existingKeys = new Set(existing.map(r=> r.id || `${r.nome}|${r.matricula}|${r.timestamp}`));
    (incoming.submissions[sid]||[]).forEach(r=>{
      const key = r.id || `${r.nome}|${r.matricula}|${r.timestamp}`;
      if(!existingKeys.has(key)){ existing.push(r); existingKeys.add(key); addedSubs++; }
    });
    existing.sort((a,b)=>a.timestamp-b.timestamp);
  });

  // customTemplates: union by id, keep the most recently updated version on conflict
  let addedTemplates = 0;
  (incoming.customTemplates||[]).forEach(t=>{
    const idx = merged.customTemplates.findIndex(x=>x.id===t.id);
    if(idx===-1){ merged.customTemplates.push(t); addedTemplates++; }
    else if((t.updatedAt||0) > (merged.customTemplates[idx].updatedAt||0)){ merged.customTemplates[idx] = t; }
  });

  STORE = merged;
  const ok = saveStore(STORE);
  return { ok, addedSessions, addedSubs, addedTemplates };
}

function saveStore(s){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify(s));
    return true;
  }catch(e){
    alert("Não foi possível salvar no navegador (" + e.message + "). Verifique se o navegador não está em modo privado/anônimo e se há espaço de armazenamento disponível.");
    return false;
  }
}

function parseQuestionBlock(raw){
  const blocks = raw.split(/\n\s*\n/).map(b=>b.trim()).filter(Boolean);
  const questions = []; const notes = [];
  blocks.forEach((block,i)=>{
    const lines = block.split("\n").map(l=>l.trim()).filter(Boolean);
    if(lines.length<3){ notes.push(`Bloco ${i+1}: ignorado (precisa de enunciado e ao menos 2 opções).`); return; }
    const text = lines[0].replace(/^\d+[).]\s*/, "");
    const options = []; let correctIndex = null;
    lines.slice(1).forEach(line=>{
      const isCorrect = /\*\s*$/.test(line);
      const clean = line.replace(/^[a-zA-Z][).]\s*/, "").replace(/\*\s*$/, "").trim();
      if(isCorrect) correctIndex = options.length;
      options.push(clean);
    });
    if(correctIndex===null) notes.push(`"${text.slice(0,40)}..." importada sem gabarito — marque a resposta certa na lista abaixo.`);
    questions.push({ id: uid(), text, options, correctIndex });
  });
  return { questions, notes };
}

// ======================= SCORING =======================
function scoreSubmission(questions, answers){
  let correct=0;
  questions.forEach(q=>{ if(answers[q.id]===q.correctIndex) correct++; });
  const total = questions.length;
  const pct = total ? Math.round((correct/total)*1000)/10 : 0;
  return { correct, total, pct };
}

      .map(v=>`"${String(v).replace(/"/g,'""')}"`).join(";"));

// ======================= CSV import (Microsoft Forms) =======================
function parseCsv(text){
  // Strip BOM, auto-detect comma vs semicolon delimiter, handle quoted fields.
  text = text.replace(/^\uFEFF/, "");
  const firstLine = text.split(/\r\n|\n/)[0] || "";
  const delim = (firstLine.split(";").length > firstLine.split(",").length) ? ";" : ",";
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i], next = text[i+1];
    if(inQuotes){
      if(c === '"' && next === '"'){ field += '"'; i++; }
      else if(c === '"'){ inQuotes = false; }
      else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === delim){ row.push(field); field = ""; }
      else if(c === "\n"){ row.push(field); rows.push(row); row = []; field = ""; }
      else if(c === "\r"){ /* skip */ }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  const filtered = rows.filter(r => r.some(c => c.trim() !== ""));
  if(!filtered.length) return { headers: [], rows: [] };
  const headers = filtered[0].map(h => h.trim());
  const dataRows = filtered.slice(1).map(r => {
    const obj = {};
    headers.forEach((h,i) => obj[h] = (r[i]||"").trim());
    return obj;
  });
  return { headers, rows: dataRows };
}

function parseNotaField(raw){
  // Accepts "8/10", "80", "80%", "8,5/10" and returns { correct, total, pct } (correct/total may be null)
  if(!raw) return { correct: null, total: null, pct: 0 };
  const s = String(raw).trim().replace("%", "");
  const fracMatch = s.match(/^([\d.,]+)\s*\/\s*([\d.,]+)$/);
  if(fracMatch){
    const correct = parseFloat(fracMatch[1].replace(",", "."));
    const total = parseFloat(fracMatch[2].replace(",", "."));
    const pct = total ? Math.round((correct/total)*1000)/10 : 0;
    return { correct, total, pct };
  }
  const num = parseFloat(s.replace(",", "."));
  if(isNaN(num)) return { correct: null, total: null, pct: 0 };
  const pct = num <= 1 ? Math.round(num*1000)/10 : Math.round(num*10)/10;
  return { correct: null, total: null, pct };
}

function generateQrSvg(text){
  try{
    if(!text || !text.trim()) return `<div class="muted">Digite um endereço para gerar o QR Code.</div>`;
    const value = text.trim();
    let qr = null;
    for(let typeNumber = 4; typeNumber <= 40; typeNumber++){
      try{
        const candidate = qrcode(typeNumber, "M");
        candidate.addData(value);
        candidate.make();
        qr = candidate;
        break;
      }catch(innerErr){
        // too small for this typeNumber — try the next size up
      }
    }
    if(!qr) return `<div class="muted">Endereço muito longo para gerar o QR Code.</div>`;
    return qr.createSvgTag(6, 12);
  }catch(e){
    return `<div class="muted">Não foi possível gerar o QR Code (${esc(e.message||String(e))}).</div>`;
  }
}

// ======================= EVENT HANDLERS =======================
function attachHandlers(){
  // --- participant intro ---
  const startQuizBtn = document.getElementById("startQuizBtn");
  if(startQuizBtn){
    document.getElementById("pNome").oninput = e=>participant.nome=e.target.value;
    document.getElementById("pMatricula").oninput = e=>participant.matricula=e.target.value;
    document.getElementById("pEmpresa").oninput = e=>participant.empresa=e.target.value;
    document.getElementById("pTempoEmpresa").oninput = e=>participant.tempoEmpresa=e.target.value;
    document.getElementById("pTempoFuncao").oninput = e=>participant.tempoFuncao=e.target.value;
    document.getElementById("pGerenciaSupervisao").oninput = e=>participant.gerenciaSupervisao=e.target.value;
    document.querySelectorAll("[data-objopt]").forEach(el=>{
      el.onclick = ()=>{ const s=activeSession(); participant.objetivo = s.objetivoOptions[Number(el.dataset.objopt)]; render(); };
    });
    startQuizBtn.onclick = ()=>{
      const s = activeSession();
      const needsObj = (s.objetivoOptions||[]).length>0;
      if(!participant.nome.trim() || !participant.empresa.trim()) return alert("Preencha nome e empresa.");
      if(!participant.matricula.trim()) return alert("Preencha a matrícula.");
      if(!participant.tempoEmpresa.trim()) return alert("Preencha o tempo de empresa.");
      if(!participant.tempoFuncao.trim()) return alert("Preencha o tempo na função.");
      if(!participant.gerenciaSupervisao.trim()) return alert("Preencha a gerência/supervisão.");
      if(needsObj && !participant.objetivo) return alert("Selecione o objetivo do treinamento.");
      participant.step="quiz"; participant.current=0; render();
    };
  }
  // --- quiz ---
  const quizNext = document.getElementById("quizNext");
  const quizFinish = document.getElementById("quizFinish");
  const quizBack = document.getElementById("quizBack");
  if(quizNext || quizFinish || quizBack){
    const s = activeSession();
    const q = s.questions[participant.current];
    document.querySelectorAll("[data-ansidx]").forEach(el=>{
      el.onclick = ()=>{ participant.answers[q.id] = Number(el.dataset.ansidx); render(); };
    });
    if(quizBack) quizBack.onclick = ()=>{ participant.current--; render(); };
    if(quizNext) quizNext.onclick = ()=>{ participant.current++; render(); };
    if(quizFinish) quizFinish.onclick = ()=>{
      participant.step="assinatura"; render();
    };
  }

  // --- assinatura digital ---
  const signatureCanvas = document.getElementById("signatureCanvas");
  if(signatureCanvas){
    const s = activeSession();
    const ctx = signatureCanvas.getContext("2d");
    ctx.lineWidth = 2.2; ctx.lineCap = "round"; ctx.strokeStyle = "#0B1220";
    let drawing = false, hasSignature = false;
    const getPos = (e)=>{
      const rect = signatureCanvas.getBoundingClientRect();
      const scaleX = signatureCanvas.width / rect.width;
      const scaleY = signatureCanvas.height / rect.height;
      const point = e.touches ? e.touches[0] : e;
      return { x: (point.clientX - rect.left) * scaleX, y: (point.clientY - rect.top) * scaleY };
    };
    const start = (e)=>{ e.preventDefault(); drawing = true; const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); };
    const move = (e)=>{ if(!drawing) return; e.preventDefault(); const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); hasSignature = true; };
    const end = ()=>{ drawing = false; };
    signatureCanvas.addEventListener("mousedown", start);
    signatureCanvas.addEventListener("mousemove", move);
    window.addEventListener("mouseup", end);
    signatureCanvas.addEventListener("touchstart", start, { passive:false });
    signatureCanvas.addEventListener("touchmove", move, { passive:false });
    signatureCanvas.addEventListener("touchend", end);

    const finishSubmission = (assinatura)=>{
      const { correct, total, pct } = scoreSubmission(s.questions, participant.answers);
      const aprovado = pct >= s.passMark;
      const respostas = s.questions.map(q => (participant.answers[q.id] !== undefined ? participant.answers[q.id] : null));
      const record = { id: uid(), nome:participant.nome.trim(), matricula:participant.matricula.trim(), empresa:participant.empresa.trim(), tempoEmpresa:participant.tempoEmpresa.trim(), tempoFuncao:participant.tempoFuncao.trim(), gerenciaSupervisao:participant.gerenciaSupervisao.trim(), objetivo:participant.objetivo, correct, total, pct, aprovado, assinatura: assinatura||"", respostas, timestamp:Date.now() };
      if(!STORE.submissions[s.id]) STORE.submissions[s.id]=[];
      STORE.submissions[s.id].push(record);
      saveStore(STORE);
      if(FIREBASE_ENABLED && db){
        db.collection("aptus_submissions").add({ ...record, sessionId: s.id }).catch(e=>console.error("Erro ao enviar resposta ao Firestore:", e));
      }
      participant.result = record; participant.step="done"; render();
    };

    const signatureClearBtn = document.getElementById("signatureClearBtn");
    if(signatureClearBtn) signatureClearBtn.onclick = ()=>{ ctx.clearRect(0,0,signatureCanvas.width,signatureCanvas.height); hasSignature = false; };
    const signatureConfirmBtn = document.getElementById("signatureConfirmBtn");
    if(signatureConfirmBtn) signatureConfirmBtn.onclick = ()=>{
      if(!hasSignature) return alert("Assine no quadro antes de confirmar, ou use \"Enviar sem assinatura\".");
      finishSubmission(signatureCanvas.toDataURL("image/png"));
    };
    const signatureSkipBtn = document.getElementById("signatureSkipBtn");
    if(signatureSkipBtn) signatureSkipBtn.onclick = ()=>{ finishSubmission(""); };
  }
  const verPresencaBtn = document.getElementById("verPresencaBtn");
  if(verPresencaBtn) verPresencaBtn.onclick = ()=>{
    const sess = activeSession();
    participant.step="lista"; render();
    if(FIREBASE_ENABLED && db && sess) syncFirestoreSubmissions(sess.id);
  };
  const voltarDoResultadoBtn = document.getElementById("voltarDoResultadoBtn");
  if(voltarDoResultadoBtn) voltarDoResultadoBtn.onclick = ()=>{ participant.step="done"; render(); };

  // --- admin: montar ---
  const templatePicker = document.getElementById("templatePicker");
  if(templatePicker) templatePicker.onchange = e=>{
    if(e.target.value==="") return;
    const idx = Number(e.target.value);
    const override = findOverrideByTitle(TEMPLATES[idx].title);
    if(override){
      draft = newDraftFromCustom(override.id);
      draftCustomId = override.id;
      saveModelNotice = "Você já tinha uma versão editada dessa prova — carregando ela em vez da original.";
      setTimeout(()=>{ saveModelNotice=""; render(); }, 4500);
    } else {
      draft = newDraftFromTemplate(idx);
      draftCustomId = null;
    }
    render();
  };
  document.querySelectorAll("[data-loadcustom]").forEach(btn=>{
    btn.onclick = ()=>{
      const d = newDraftFromCustom(btn.dataset.loadcustom);
      if(!d) return;
      draft = d;
      draftCustomId = btn.dataset.loadcustom;
      render();
    };
  });
  document.querySelectorAll("[data-delcustom]").forEach(btn=>{
    btn.onclick = ()=>{ deleteCustomTemplate(btn.dataset.delcustom); };
  });
  const saveModelBtn = document.getElementById("saveModelBtn");
  if(saveModelBtn) saveModelBtn.onclick = ()=>{ saveCustomTemplate(); };
  const bindField = (id, prop, isNum)=>{
    const el = document.getElementById(id);
    if(el) el.oninput = e=>{ draft[prop] = isNum ? e.target.value : e.target.value; };
  };
  bindField("fTitle","title"); bindField("fCodigo","codigo");
  bindField("fCarga","cargaHoraria");
  function refreshStartBtn(){
    const btn = document.getElementById("startSessionBtn");
    if(!btn) return;
    const pendingCount = draft.questions.filter(q=>typeof q.correctIndex!=="number").length;
    const noInstrutor = !draft.instrutor.trim();
    const noLocal = !draft.local.trim();
    btn.disabled = draft.questions.length===0 || pendingCount>0 || noInstrutor || noLocal;
    btn.innerHTML = pendingCount>0
      ? `&#9654; Marque o gabarito de ${pendingCount} questão(ões) para iniciar`
      : noInstrutor
        ? `&#9654; Informe o instrutor para iniciar`
        : noLocal
          ? `&#9654; Informe o local/turno para iniciar`
          : `&#9654; Iniciar sessão (ativar para participantes)`;
  }
  const fInstrutor = document.getElementById("fInstrutor");
  if(fInstrutor) fInstrutor.oninput = e=>{ draft.instrutor = e.target.value; refreshStartBtn(); };
  const fInstrutorMatricula = document.getElementById("fInstrutorMatricula");
  if(fInstrutorMatricula) fInstrutorMatricula.oninput = e=>{ draft.instrutorMatricula = e.target.value; };
  const fLocal = document.getElementById("fLocal");
  if(fLocal) fLocal.oninput = e=>{ draft.local = e.target.value; refreshStartBtn(); };
  const fPassMark = document.getElementById("fPassMark");
  if(fPassMark) fPassMark.oninput = e=>draft.passMark = e.target.value;
  const fConteudo = document.getElementById("fConteudo");
  if(fConteudo) fConteudo.oninput = e=>draft.conteudo = e.target.value;

  document.querySelectorAll(".objInput").forEach(el=>{
    el.oninput = e=>{ draft.objetivoOptions[Number(el.dataset.objidx)] = e.target.value; };
  });
  document.querySelectorAll("[data-rmobj]").forEach(el=>{
    el.onclick = ()=>{ draft.objetivoOptions.splice(Number(el.dataset.rmobj),1); render(); };
  });
  const addObjBtn = document.getElementById("addObjBtn");
  if(addObjBtn) addObjBtn.onclick = ()=>{ draft.objetivoOptions.push(""); render(); };

  const pasteArea = document.getElementById("pasteArea");
  if(pasteArea) pasteArea.oninput = e=>pasteText = e.target.value;
  const importPasteBtn = document.getElementById("importPasteBtn");
  if(importPasteBtn) importPasteBtn.onclick = ()=>{
    const { questions, notes } = parseQuestionBlock(pasteText);
    parseNotes = notes;
    if(questions.length){ draft.questions.push(...questions); pasteText=""; }
    render();
  };

  document.querySelectorAll("[data-rmq]").forEach(el=>{
    el.onclick = ()=>{ draft.questions = draft.questions.filter(q=>q.id!==el.dataset.rmq); render(); };
  });
  document.querySelectorAll("[data-markcorrect]").forEach(el=>{
    el.onclick = ()=>{
      const [qid, oi] = el.dataset.markcorrect.split("|");
      const q = draft.questions.find(qq=>qq.id===qid);
      q.correctIndex = Number(oi);
      render();
    };
  });

  const endSessionBtn = document.getElementById("endSessionBtn");
  if(endSessionBtn) endSessionBtn.onclick = ()=>{ STORE.activeSessionId=null; saveStore(STORE); render(); };

  const toggleQrBtn = document.getElementById("toggleQrBtn");
  if(toggleQrBtn) toggleQrBtn.onclick = ()=>{ qrVisible = !qrVisible; render(); };
  const qrUrlInput = document.getElementById("qrUrlInput");
  if(qrUrlInput) qrUrlInput.oninput = e=>{
    qrUrl = e.target.value;
    const holder = document.getElementById("qrSvgHolder");
    if(holder) holder.innerHTML = generateQrSvg(qrUrl);
  };

  const startSessionBtn = document.getElementById("startSessionBtn");
  if(startSessionBtn) startSessionBtn.onclick = ()=>{
    if(!draft.instrutor.trim()) return alert("Informe o instrutor antes de iniciar a sessão.");
    if(!draft.local.trim()) return alert("Informe o local/turno antes de iniciar a sessão.");
    const session = {
      id: uid(), title: draft.title.trim()||"Treinamento", codigo: draft.codigo.trim(),
      local: draft.local.trim(), instrutor: draft.instrutor.trim(), instrutorMatricula: draft.instrutorMatricula.trim(), cargaHoraria: draft.cargaHoraria.trim(),
      conteudo: draft.conteudo.trim(), passMark: Number(draft.passMark)||70,
      questions: draft.questions, objetivoOptions: draft.objetivoOptions.filter(o=>o.trim()!==""),
      createdAt: Date.now()
    };
    STORE.sessions.unshift(session);
    STORE.activeSessionId = session.id;
    saveStore(STORE);
    qrUrl = "";
    if(FIREBASE_ENABLED && db){
      db.collection("aptus_sessions").doc(session.id).set(session).catch(e=>console.error("Erro ao publicar sessão no Firestore:", e));
    }
    render();
  };

  // --- admin: resultados ---
  const resultsSessionPicker = document.getElementById("resultsSessionPicker");
  if(resultsSessionPicker) resultsSessionPicker.onchange = e=>{
    resultsSessionId = e.target.value||null;
    render();
    if(FIREBASE_ENABLED && db && resultsSessionId) syncFirestoreSubmissions(resultsSessionId);
  };
  const exportCsvBtn = document.getElementById("exportCsvBtn");
  if(exportCsvBtn) exportCsvBtn.onclick = ()=>{
    const subs = STORE.submissions[resultsSessionId]||[];
    downloadText(`lista_presenca_${resultsSessionId}.csv`, toCSV(subs));
  };
  document.querySelectorAll("[data-comprovante]").forEach(btn=>{
    btn.onclick = ()=>{
      const sess = STORE.sessions.find(x=>x.id===resultsSessionId);
      const sub = (STORE.submissions[resultsSessionId]||[]).find(x=>x.id===btn.dataset.comprovante);
      if(!sess || !sub) return;
      buildPrintLayer(sess, "comprovante", sub);
      setTimeout(()=>window.print(), 200);
    };
  });
  document.querySelectorAll("[data-evidencia]").forEach(btn=>{
    btn.onclick = ()=>{
      const sess = STORE.sessions.find(x=>x.id===resultsSessionId);
      const sub = (STORE.submissions[resultsSessionId]||[]).find(x=>x.id===btn.dataset.evidencia);
      if(!sess || !sub) return;
      if(!sess.questions || !sess.questions.length){
        alert("Essa sessão não tem as perguntas guardadas (por exemplo, veio de uma importação do Forms) — não é possível gerar a evidência questão a questão.");
        return;
      }
      buildPrintLayer(sess, "evidencia", sub);
      setTimeout(()=>window.print(), 200);
    };
  });

  // --- admin: imprimir ---
  const printSessionPicker = document.getElementById("printSessionPicker");
  if(printSessionPicker) printSessionPicker.onchange = e=>{ printSessionId = e.target.value||null; render(); };
  const presencaRowsInput = document.getElementById("presencaRowsInput");
  if(presencaRowsInput) presencaRowsInput.oninput = e=>{ presencaRows = Number(e.target.value)||30; };
  const printProvaBtn = document.getElementById("printProvaBtn");
  if(printProvaBtn) printProvaBtn.onclick = ()=>{
    buildPrintLayer(STORE.sessions.find(s=>s.id===printSessionId), "prova");
    setTimeout(()=>window.print(), 200);
  };
  const printListaOficialBtn = document.getElementById("printListaOficialBtn");
  if(printListaOficialBtn) printListaOficialBtn.onclick = ()=>{
    buildPrintLayer(STORE.sessions.find(s=>s.id===printSessionId), "presenca-oficial");
    setTimeout(()=>window.print(), 200);
  };
  const printPresencaBtn = document.getElementById("printPresencaBtn");
  if(printPresencaBtn) printPresencaBtn.onclick = ()=>{
    buildPrintLayer(STORE.sessions.find(s=>s.id===printSessionId), "presenca");
    setTimeout(()=>window.print(), 200);
  };

  // --- tabbar ---
  document.querySelectorAll(".tabbar button").forEach(btn=>{
    btn.onclick = ()=>{ adminTab = btn.dataset.tab; render(); };
  });

  // --- histórico / backup ---
  document.querySelectorAll("[data-listaoficial]").forEach(btn=>{
    btn.onclick = ()=>{
      const sess = STORE.sessions.find(s=>s.id===btn.dataset.listaoficial);
      if(!sess) return;
      buildPrintLayer(sess, "presenca-oficial");
      setTimeout(()=>window.print(), 200);
    };
  });
  document.querySelectorAll("[data-delsession]").forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.dataset.delsession;
      const sess = STORE.sessions.find(s=>s.id===id);
      const label = sess ? sess.title : "esta sessão";
      if(!confirm(`Apagar "${label}" e todas as respostas registradas nela? Essa ação não pode ser desfeita.`)) return;
      STORE.sessions = STORE.sessions.filter(s=>s.id!==id);
      delete STORE.submissions[id];
      if(STORE.activeSessionId===id) STORE.activeSessionId = null;
      if(resultsSessionId===id) resultsSessionId = null;
      if(printSessionId===id) printSessionId = null;
      saveStore(STORE);
      render();
    };
  });
  const clearAllHistoryBtn = document.getElementById("clearAllHistoryBtn");
  if(clearAllHistoryBtn) clearAllHistoryBtn.onclick = ()=>{
    if(!confirm("Apagar TODO o histórico deste navegador — todas as sessões e provas respondidas? Essa ação não pode ser desfeita. Considere exportar um backup antes.")) return;
    STORE = { sessions: [], activeSessionId: null, submissions: {} };
    resultsSessionId = null; printSessionId = null;
    saveStore(STORE);
    render();
  };
  const exportBackupBtn = document.getElementById("exportBackupBtn");
  if(exportBackupBtn) exportBackupBtn.onclick = ()=>{
    const blob = new Blob([JSON.stringify(STORE, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const stamp = new Date().toISOString().slice(0,16).replace(/[:T]/g,"-");
    a.href = url; a.download = `robo_provas_backup_${stamp}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  };
  const exportAllCsvBtn = document.getElementById("exportAllCsvBtn");
  if(exportAllCsvBtn) exportAllCsvBtn.onclick = ()=>{
    downloadText(`robo_provas_historico_geral.csv`, toCSVGeral());
  };
  const importMergeInput = document.getElementById("importMergeInput");
  if(importMergeInput) importMergeInput.onchange = e=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = evt=>{
      try{
        const data = JSON.parse(evt.target.result);
        if(!data.sessions || !data.submissions) throw new Error("formato inválido");
        const { ok, addedSessions, addedSubs, addedTemplates } = mergeStore(data);
        if(!ok) return;
        alert(`Histórico juntado: ${addedSessions} sessão(ões) nova(s), ${addedSubs} prova(s) nova(s)${addedTemplates?`, ${addedTemplates} modelo(s) salvo(s)`:""}. O que você já tinha continua aqui.`);
        render();
      }catch(err){
        alert("Não foi possível ler esse arquivo de backup: " + err.message);
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  };
  const importReplaceBtn = document.getElementById("importReplaceBtn");
  const importReplaceInput = document.getElementById("importReplaceInput");
  if(importReplaceBtn) importReplaceBtn.onclick = ()=> importReplaceInput.click();
  if(importReplaceInput) importReplaceInput.onchange = e=>{
    const file = e.target.files[0];
    if(!file) return;
    if(!confirm("Isso vai APAGAR todo o histórico deste navegador e substituir pelo conteúdo do arquivo. Essa ação não pode ser desfeita. Continuar?")) { e.target.value=""; return; }
    const reader = new FileReader();
    reader.onload = evt=>{
      try{
        const data = JSON.parse(evt.target.result);
        if(!data.sessions || !data.submissions) throw new Error("formato inválido");
        STORE = { sessions: data.sessions, activeSessionId: data.activeSessionId||null, submissions: data.submissions, customTemplates: data.customTemplates||[] };
        const ok = saveStore(STORE);
        if(!ok) return;
        alert("Histórico substituído com sucesso.");
        render();
      }catch(err){
        alert("Não foi possível ler esse arquivo de backup: " + err.message);
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  };

  // --- importar do Microsoft Forms ---
  const syncAllFirestoreBtn = document.getElementById("syncAllFirestoreBtn");
  if(syncAllFirestoreBtn) syncAllFirestoreBtn.onclick = async ()=>{
    syncAllFirestoreBtn.disabled = true;
    syncAllFirestoreBtn.textContent = "Sincronizando...";
    for(const sess of STORE.sessions){
      await syncFirestoreSubmissions(sess.id);
    }
  };

  const toggleFormsImportBtn = document.getElementById("toggleFormsImportBtn");
  if(toggleFormsImportBtn) toggleFormsImportBtn.onclick = ()=>{ formsImportVisible = !formsImportVisible; render(); };

  const importFormsSessionPicker = document.getElementById("importFormsSessionPicker");
  if(importFormsSessionPicker) importFormsSessionPicker.onchange = e=>{ importFormsSessionId = e.target.value; render(); };

  const bindNewFormsField = (id, prop)=>{
    const el = document.getElementById(id);
    if(el) el.oninput = e=>{ newFormsSession[prop] = e.target.value; };
  };
  bindNewFormsField("newFormsTitle","title");
  bindNewFormsField("newFormsInstrutor","instrutor");
  bindNewFormsField("newFormsLocal","local");
  bindNewFormsField("newFormsPassMark","passMark");

  const formsCsvInput = document.getElementById("formsCsvInput");
  if(formsCsvInput) formsCsvInput.onchange = e=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader2 = new FileReader();
    reader2.onload = evt=>{
      try{
        const { headers, rows } = parseCsv(evt.target.result);
        if(!headers.length) throw new Error("não encontrei colunas neste arquivo");
        importCsvHeaders = headers;
        importCsvRows = rows;
        const guess = (patterns) => headers.find(h => patterns.some(p => h.toLowerCase().includes(p))) || "";
        importColumnMap = {
          nome: guess(["nome"]),
          matricula: guess(["matrícula","matricula"]),
          empresa: guess(["empresa"]),
          tempoEmpresa: guess(["tempo de empresa"]),
          tempoFuncao: guess(["tempo na função","tempo na funcao"]),
          gerenciaSupervisao: guess(["gerência","gerencia","supervisão","supervisao"]),
          objetivo: guess(["objetivo"]),
          nota: guess(["pontuação","pontuacao","nota","score"]),
          dataHora: guess(["hora de conclusão","hora de conclusao","data"]),
        };
        formsImportNotice = "";
        render();
      }catch(err){
        alert("Não foi possível ler esse CSV: " + err.message);
      }
    };
    reader2.readAsText(file, "UTF-8");
  };

  Object.keys(importColumnMap).forEach(key=>{
    const el = document.getElementById(`map_${key}`);
    if(el) el.onchange = e=>{ importColumnMap[key] = e.target.value; };
  });

  const importFormsBtn = document.getElementById("importFormsBtn");
  if(importFormsBtn) importFormsBtn.onclick = ()=>{
    if(!importColumnMap.nome){ alert("Selecione qual coluna é o Nome."); return; }
    if(!importColumnMap.nota){ alert("Selecione qual coluna é a Nota/Pontuação."); return; }

    let session;
    if(importFormsSessionId){
      session = STORE.sessions.find(s=>s.id===importFormsSessionId);
      if(!session){ alert("Sessão não encontrada."); return; }
    } else {
      if(!newFormsSession.title.trim()){ alert("Dê um título para a nova sessão."); return; }
      session = {
        id: uid(), title: newFormsSession.title.trim(), codigo: "", local: newFormsSession.local.trim(),
        instrutor: newFormsSession.instrutor.trim(), cargaHoraria: "", conteudo: "",
        passMark: Number(newFormsSession.passMark)||70, questions: [], objetivoOptions: [],
        createdAt: Date.now(), source: "forms",
      };
      STORE.sessions.unshift(session);
    }

    if(!STORE.submissions[session.id]) STORE.submissions[session.id] = [];
    const existing = STORE.submissions[session.id];
    const existingKeys = new Set(existing.map(r => `${r.nome}|${r.matricula}|${r.timestamp}`));
    let added = 0, skipped = 0;

    importCsvRows.forEach(row=>{
      const nome = (row[importColumnMap.nome]||"").trim();
      if(!nome) { skipped++; return; }
      const { correct, total, pct } = parseNotaField(row[importColumnMap.nota]);
      const matricula = importColumnMap.matricula ? (row[importColumnMap.matricula]||"").trim() : "";
      const dataHoraRaw = importColumnMap.dataHora ? row[importColumnMap.dataHora] : "";
      const parsedDate = dataHoraRaw ? Date.parse(dataHoraRaw) : NaN;
      const timestamp = !isNaN(parsedDate) ? parsedDate : Date.now();
      const key = `${nome}|${matricula}|${timestamp}`;
      if(existingKeys.has(key)){ skipped++; return; }
      const record = {
        id: uid(),
        nome,
        matricula,
        empresa: importColumnMap.empresa ? (row[importColumnMap.empresa]||"").trim() : "",
        tempoEmpresa: importColumnMap.tempoEmpresa ? (row[importColumnMap.tempoEmpresa]||"").trim() : "",
        tempoFuncao: importColumnMap.tempoFuncao ? (row[importColumnMap.tempoFuncao]||"").trim() : "",
        gerenciaSupervisao: importColumnMap.gerenciaSupervisao ? (row[importColumnMap.gerenciaSupervisao]||"").trim() : "",
        objetivo: importColumnMap.objetivo ? (row[importColumnMap.objetivo]||"").trim() : "",
        correct: correct !== null ? correct : 0,
        total: total !== null ? total : 0,
        pct,
        aprovado: pct >= session.passMark,
        timestamp,
      };
      existing.push(record);
      existingKeys.add(key);
      added++;
    });

    saveStore(STORE);
    formsImportNotice = `${added} resposta(s) importada(s)${skipped?`, ${skipped} ignorada(s) (sem nome ou já importadas)`:""}.`;
    importCsvHeaders = [];
    importCsvRows = [];
    render();
  };
}

render();
const statusBadge = document.getElementById("onlineStatusBadge");
if(statusBadge){
  statusBadge.innerHTML = FIREBASE_ENABLED
    ? `<span style="color:#16a34a;font-weight:bold;">&#9679; Sincronização online ativa</span>`
    : `<span style="color:#94a3b8;">Modo local (sem sincronização online)</span>`;
}
loadFirestoreSession();
</script>
</body>
</html>
